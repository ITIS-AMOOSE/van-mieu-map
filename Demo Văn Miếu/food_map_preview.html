<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bản Đồ Ẩm Thực Văn Miếu - Hà Nội | Demo Data</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <!-- MapLibre GL JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@5.2.0/dist/maplibre-gl.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;
      background: #fbf7f4;
      color: #1f2937;
    }
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* LEFT PANEL */
    .left-panel {
      width: 430px;
      min-width: 380px;
      max-width: 460px;
      height: 100%;
      background: #ffffff;
      border-right: 1px solid #ebdcd6;
      box-shadow: 2px 0 16px rgba(122, 30, 30, 0.04);
      display: flex;
      flex-direction: column;
      z-index: 30;
      overflow: hidden;
    }
    .panel-header {
      padding: 16px 20px 12px;
      background: #fff8f6;
      border-bottom: 1px solid #f2e2dc;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .logo-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #ffebe5;
      border: 1px solid #f8cfc6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .brand-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 20px;
      font-weight: 700;
      color: #7a1e1e;
      line-height: 1.2;
    }
    .brand-subtitle {
      font-size: 12px;
      color: #78716c;
      margin-top: 2px;
    }
    .center-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      border: 1px solid #f4d0c8;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(122, 30, 30, 0.04);
    }
    .center-card:hover {
      background: #fff3f0;
      border-color: #e11d48;
      transform: translateY(-1px);
    }
    .center-card .icon { font-size: 22px; }
    .center-card .meta { flex: 1; }
    .center-card .title {
      font-size: 13.5px;
      font-weight: 700;
      color: #991b1b;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .center-badge {
      font-size: 10px;
      background: #fef2f2;
      color: #dc2626;
      padding: 1px 6px;
      border-radius: 9999px;
      border: 1px solid #fecaca;
    }
    .center-card .addr {
      font-size: 11.5px;
      color: #78716c;
      margin-top: 2px;
    }
    .search-box {
      padding: 12px 20px 8px;
    }
    .search-input-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fbf7f4;
      border: 1px solid #e7d8d2;
      border-radius: 12px;
      padding: 8px 14px;
      transition: all 0.2s ease;
    }
    .search-input-wrap:focus-within {
      border-color: #7a1e1e;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(122, 30, 30, 0.1);
    }
    .search-input-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 13.5px;
      color: #1c1917;
    }
    .toggle-row {
      display: flex;
      padding: 0 20px 8px;
      gap: 8px;
    }
    .toggle-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #f5eeea;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12.5px;
      font-weight: 600;
      color: #57534e;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .toggle-btn.active {
      background: #ffffff;
      border-color: #e7d5ce;
      color: #7a1e1e;
      font-weight: 700;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }
    .toggle-badge {
      background: #ebdcd6;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 9999px;
      color: #44403c;
    }
    .toggle-btn.active .toggle-badge {
      background: #ffebe5;
      color: #991b1b;
    }
    .theme-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 20px 8px;
      scrollbar-width: thin;
      scrollbar-color: #f1dfd8 transparent;
    }
    .theme-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffffff;
      border: 1px solid #ebdcd6;
      border-radius: 9999px;
      padding: 5px 12px;
      font-size: 12.5px;
      font-weight: 500;
      color: #4b5563;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .theme-chip:hover {
      background: #fff5f2;
      border-color: #fca5a5;
      color: #991b1b;
    }
    .theme-chip.active {
      background: #7a1e1e;
      border-color: #7a1e1e;
      color: #ffffff;
      font-weight: 600;
    }
    .toolbar {
      padding: 8px 20px;
      display: flex;
      gap: 8px;
      background: #faf6f4;
      border-top: 1px solid #f0e4df;
      border-bottom: 1px solid #f0e4df;
    }
    .toolbar select {
      flex: 1;
      background: #ffffff;
      border: 1px solid #e2d3cd;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 500;
      color: #44403c;
      outline: none;
      cursor: pointer;
    }
    .results-bar {
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: #57534e;
    }
    .list-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scrollbar-width: thin;
      scrollbar-color: #ebdcd6 transparent;
    }
    .card-item {
      background: #ffffff;
      border: 1px solid #eeddd7;
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      display: flex;
      gap: 12px;
      transition: all 0.2s ease;
    }
    .card-item:hover {
      border-color: #fca5a5;
      background: #fffafa;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(122, 30, 30, 0.08);
    }
    .card-item.selected {
      border-color: #dc2626 !important;
      background: #fff8f6 !important;
      box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.2), 0 6px 16px rgba(122, 30, 30, 0.12) !important;
    }
    .card-thumb-wrap {
      width: 88px;
      height: 88px;
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      background: #f5ede8;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-cat-badge {
      position: absolute;
      bottom: 4px;
      left: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 9.5px;
      font-weight: 600;
      padding: 2px 4px;
      border-radius: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-name {
      font-size: 14px;
      font-weight: 700;
      color: #1f2937;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-addr {
      font-size: 12px;
      color: #57534e;
      margin: 3px 0 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.35;
    }
    .card-badges {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-dist {
      font-size: 11px;
      font-weight: 600;
      color: #991b1b;
      background: #fef2f2;
      padding: 1px 6px;
      border-radius: 6px;
      border: 1px solid #fecaca;
    }
    .badge-rate {
      font-size: 11px;
      font-weight: 700;
      color: #b45309;
      background: #fffbeb;
      padding: 1px 6px;
      border-radius: 6px;
      border: 1px solid #fde68a;
    }
    .card-foot {
      display: flex;
      justify-content: space-between;
      border-top: 1px dashed #f0e4df;
      padding-top: 4px;
      margin-top: 4px;
      font-size: 11.5px;
    }
    .card-dish-tag {
      color: #78716c;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-price-tag {
      font-weight: 700;
      color: #b91c1c;
      white-space: nowrap;
    }

    /* MAP CONTAINER */
    .map-container {
      flex: 1;
      height: 100%;
      position: relative;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* TOP BANNER */
    .top-banner {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 9999px;
      box-shadow: 0 4px 16px rgba(122, 30, 30, 0.1);
      border: 1px solid #f2e7e3;
    }
    .banner-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #7a1e1e;
    }
    .banner-badge {
      font-size: 12px;
      font-weight: 600;
      color: #b45309;
      background: #fffbeb;
      padding: 2px 10px;
      border-radius: 9999px;
      border: 1px solid #fde68a;
      transition: all 0.2s ease;
    }
    .banner-badge:hover {
      background: #fef3c7;
    }

    /* MAP CONTROLS */
    .map-controls {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .map-btn {
      background: #ffffff;
      border: 1px solid #e8ded9;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .map-btn:hover {
      background: #fff8f6;
      border-color: #f8cfc6;
      color: #7a1e1e;
      transform: translateY(-1px);
    }
    .zoom-group {
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #e8ded9;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    .zoom-btn {
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      font-size: 18px;
      font-weight: 600;
      color: #4b5563;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .zoom-btn:hover {
      background: #fff5f2;
      color: #7a1e1e;
    }

    /* BOTTOM BAR */
    .bottom-bar {
      position: absolute;
      bottom: 16px;
      left: 20px;
      right: 20px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .pill-group {
      display: flex;
      gap: 8px;
      pointer-events: auto;
    }
    .pill-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      border: 1px solid #e5e7eb;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }
    .pill-btn.active {
      background: #ffffff;
      border-color: #d1d5db;
      color: #111827;
      font-weight: 700;
    }
    .dot-amber { width: 8px; height: 8px; border-radius: 50%; background: #d97706; }
    .dot-red { width: 8px; height: 8px; border-radius: 50%; background: #7a1e1e; }

    /* ZERO-OFFSET EXACT NEEDLE MARKERS */
    .marker-wrap {
      position: absolute;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      cursor: pointer;
      user-select: none;
      transform-origin: 0 0;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .marker-wrap:hover {
      transform: scale(1.15);
      z-index: 9999 !important;
    }
    .marker-wrap.active {
      transform: scale(1.18);
      z-index: 10000 !important;
    }

    .anchor-dot {
      position: absolute;
      left: -2px;
      top: -2px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #7a1e1e;
      opacity: 0.5;
      pointer-events: none;
    }

    .pulse-ring {
      position: absolute;
      left: -24px;
      top: -24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.25);
      animation: pulse 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      pointer-events: none;
    }
    @keyframes pulse {
      0% { transform: scale(0.5); opacity: 0.9; }
      70% { transform: scale(2.4); opacity: 0; }
      100% { transform: scale(2.6); opacity: 0; }
    }

    /* DETAIL DRAWER */
    .detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
      z-index: 100;
      display: flex;
      justify-content: flex-end;
    }
    .detail-sheet {
      width: 480px;
      max-width: 90vw;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.15);
      animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
    }
    @keyframes slideIn {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }
    .detail-img-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      background: #2b0e0e;
    }
    .detail-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .detail-close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      border: none;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .detail-img-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.2) 60%, transparent 100%);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .detail-title {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }
    .detail-sub {
      font-size: 13px;
      color: #e5e7eb;
      margin-top: 2px;
    }
    .detail-tabs {
      display: flex;
      border-bottom: 1px solid #ebdcd6;
      background: #fff8f6;
      padding: 0 12px;
    }
    .detail-tab {
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      cursor: pointer;
    }
    .detail-tab.active {
      color: #7a1e1e;
      border-bottom-color: #7a1e1e;
    }
    .detail-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .detail-box {
      background: #fbf7f4;
      border: 1px solid #ebdcd6;
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
    }
    .btn-maps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #7a1e1e;
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(122, 30, 30, 0.2);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- LEFT PANEL -->
    <aside class="left-panel">
      <div class="panel-header">
        <div class="brand-row">
          <div class="logo-badge">🏛️</div>
          <div>
            <h1 class="brand-title">Ẩm Thực Văn Miếu</h1>
            <p class="brand-subtitle">Bản đồ ẩm thực Hà Nội • Demo Data</p>
          </div>
        </div>

        <div class="center-card" id="btn-recenter-card" title="Quay lại Văn Miếu">
          <span class="icon">🏛️</span>
          <div class="meta">
            <div class="title">
              <span>Văn Miếu – Quốc Tử Giám</span>
              <span class="center-badge">Tâm điểm</span>
            </div>
            <p class="addr">58 Quốc Tử Giám • Bán kính khảo sát 2km</p>
          </div>
          <span style="color: #dc2626; font-size: 16px;">🎯</span>
        </div>
      </div>

      <div class="search-box">
        <div class="search-input-wrap">
          <span style="color: #78716c;">🔍</span>
          <input type="text" id="search-input" placeholder="Tìm món ăn, tên quán, con phố, nguyên liệu...">
        </div>
      </div>

      <div class="toggle-row">
        <button class="toggle-btn active" id="btn-view-places">
          <span>📍 Địa điểm quán</span>
          <span class="toggle-badge" id="count-places">70</span>
        </button>
        <button class="toggle-btn" id="btn-view-dishes">
          <span>🍲 Danh mục món</span>
          <span class="toggle-badge" id="count-dishes">50</span>
        </button>
      </div>

      <div class="theme-scroll" id="theme-pills">
        <!-- Rendered by JS -->
      </div>

      <div class="toolbar">
        <select id="select-dist">
          <option value="all">Khoảng cách: Tất cả (≤2km)</option>
          <option value="500">Trong bán kính 500m</option>
          <option value="1000">Trong bán kính 1.0km</option>
          <option value="1500">Trong bán kính 1.5km</option>
          <option value="2000">Trong bán kính 2.0km</option>
        </select>
        <select id="select-sort">
          <option value="distance">Gần Văn Miếu nhất</option>
          <option value="rating">Đánh giá cao nhất</option>
          <option value="name">Tên A-Z</option>
        </select>
      </div>

      <div class="results-bar">
        <span id="results-count-text">Tìm thấy 70 kết quả</span>
      </div>

      <div class="list-container" id="list-items">
        <!-- Items rendered by JS -->
      </div>
    </aside>

    <!-- MAP CONTAINER -->
    <main class="map-container">
      <div id="map"></div>

      <!-- Top Banner -->
      <div class="top-banner">
        <span style="font-size: 16px;">🏛️</span>
        <span class="banner-title">Tâm điểm: Văn Miếu Quốc Tử Giám</span>
        <span class="banner-badge" id="banner-count" style="cursor: pointer;">Bán kính 2.0km • 70 quán ăn</span>
      </div>

      <!-- Map Controls -->
      <div class="map-controls">
        <button class="map-btn" id="btn-recenter" title="Quay lại Văn Miếu">
          <span>🏛️ Văn Miếu</span>
        </button>
        <button class="map-btn" id="btn-fit-hanoi" title="Toàn cảnh Hà Nội">
          <span>Toàn cảnh Hà Nội</span>
        </button>
        <div class="zoom-group">
          <button class="zoom-btn" id="btn-zoom-in">+</button>
          <button class="zoom-btn" id="btn-zoom-out">−</button>

ninh từ xương ống bò kèm với các loại gia vị như quế, hồi, thảo quả nướng. Thịt bò thích hợp nhất để nấu phở là thịt, xương từ các giống bò ta (bò nội, bò vàng). Ngoài ra còn kèm theo các gia vị như: tương, tiêu, chanh, nước mắm, ớt, ... Những gia vị này được thêm vào tùy theo khẩu vị của người dùng. Phở thông thường được dùng để làm món điểm tâm buổi sáng hoặc lót dạ buổi đêm; nhưng ở các thành phố lớn, món ăn này có thể được thưởng thức cả ngày. Tại các tỉnh phía Nam Việt Nam và một số vùng miền khác, phở được bày kèm với đĩa rau thơm như hành, giá và những lá cây rau mùi, rau húng, trong đó ngò gai là loại lá đặc trưng của phở; tuy nhiên tại Hà Nội thông thường sẽ không có đĩa rau sống này. Phở thường là phở bò hay phở gà, nhưng đôi khi cũng có những biến thể khác, đặc biệt là phở cuốn, phở sốt vang, phở khô, phở xào, phở chua, phở vịt ở Cao Bằng, và phở thịt quay ở các tỉnh miền núi phía Bắc, phở khô ở Gia Lai.\n\nNước dùng cho nồi phở thường là nước dùng trong được ninh từ xương bò (hoặc xương lợn), kèm theo nhiều loại gia vị bao gồm quế, hồi, gừng nướng, thảo quả, sá sùng, đinh hương, hạt mùi, hành khô nướng. Thịt dùng cho món phở là thịt bò (với đủ loại thịt bắp, nạm, gầu được làm tái, hay chín hẳn) hoặc thịt gà (gà ta già luộc, xé thịt cho thịt ngọt đậm đà). \"Bánh phở\" theo truyền thống là một loại mì gạo làm từ bột gạo, tráng thành tấm mỏng rồi cắt thành sợi. Phở luôn được thưởng thức khi còn nóng hổi. Theo đó, để có một bát phở ngon và đậm vị, điều này còn phụ thuộc rất nhiều vào kĩ năng của người nấu, trong đó quan trọng nhất đó chính là nồi nước dùng.", "how_to_eat_vi": "Bạn cho bánh phở ra tô, cho thêm một ít thịt bắp bò và vài lát thịt bò tươi vào, cho lên trên chút rau gia vị rồi múc nước dùng đang sôi chan từ từ vào tô phở cho thịt chín tái từ từ. Như vậy là bạn đã hoàn thành một tô phở Hà Nội thơm ngon rồi. Mách nhỏ: Trước khi cho thịt bò tươi vào tô thì bạn hãy cho thịt ra thớt rồi dùng mặt dao đập cho thịt mềm nhé. Cách này sẽ giúp cho miếng thị ị này được thêm vào tùy theo khẩu vị của người dùng. Phở thông thường được dùng để làm món điểm tâm buổi sáng hoặc lót dạ buổi đêm; nhưng ở các thành phố lớn, món ăn này có thể được thưởng thức cả ngày. Tại các tỉnh phía Nam Việt Nam và một số vùng miền khác, phở được bày kèm với đĩa rau thơm như hành, giá và những lá cây rau mùi, rau húng, trong đó ngò gai là loại lá đặc trưng của phở; tuy nhiên tại Hà Nội thông thường sẽ không có đĩa rau sống này. Phở thường là phở bò hay phở gà, nhưng đôi khi cũng có những biến thể khác, đặc biệt là phở cuốn, phở sốt vang, phở khô, phở xào, phở chua, phở vịt ở Cao Bằng, và phở thịt quay ở các tỉnh miền núi phía Bắc, phở khô ở Gia Lai.\n\nNước dùng cho nồi phở thường là nước dùng trong được ninh từ xương bò (hoặc xương lợn), kèm theo nhiều loại gia vị bao gồm quế, hồi, gừng nướng, thảo quả, sá sùng, đinh hương, hạt mùi, hành khô nướng. Thịt dùng cho món phở là thịt bò (với đủ loại thịt bắp, nạm, gầu được làm tái, hay chín hẳn) hoặc thịt gà (gà ta già luộc, xé thịt cho thịt ngọt đậm đà). \"Bánh phở\" theo truyền thống là một loại mì gạo làm từ bột gạo, tráng thành tấm mỏng rồi cắt thành sợi. Phở luôn được thưởng thức khi còn nóng hổi. Theo đó, để có một bát phở ngon và đậm vị, điều này còn phụ thuộc rất nhiều vào kĩ năng của người nấu, trong đó quan trọng nhất đó chính là nồi nước dùng.", "how_to_eat_vi": "Nêm vào nồi nước dùng 25 gr muối (hoặc bột canh), 20 gr đường và 50 gr nước mắm. Điều chỉnh gia vị sao cho vừa miệng, nước dùng có vị ngọt thanh tự nhiên. Chần bánh phở qua nước sôi cho mềm rồi cho vào bát. Xếp thịt gà đã thái lên trên, rắc đều hành lá, rau mùi và lá chanh thái chỉ. Cuối cùng, chan nước dùng thật sôi vào bát. Thêm vài lát ớt tươi và vắt chanh theo khẩu vị cá nhân là bạn đã hoàn thành món phở gà Hà Nội thơm ngon, hấp dẫn. Món phở gà Hà Nội hoàn thành có nước dùng trong veo, vị ngọt thanh tự nhiên từ xương và thịt gà. Hương thơm lừng của hành nướng và hạt mùi quyện vào nhau tạo nên sự hấp dẫn khó cưỡng. Thịt gà dai ngon, da gà giòn sần sật kết hợp cùng mùi lá chanh vô cùng tinh tế. Đây chắc chắn là món ăn truyền thống tuyệt vời để thưởng thức ngay khi còn nóng hổi.", "ordering_phrase_vi": "Xin phở gà.", "meal_times": "breakfast", "taste_profile": "sweet", "image_url": "https://upload.wikimedia.org/wikipedia/commons/9/99/Ph%E1%BB%9F_b%C3%B2%2C_C%E1%BA%A7u_Gi%E1%BA%A5y%2C_H%C3%A0_N%E1%BB%99i.jpg", "recipe_video_url": "https://www.youtube.com/watch?v=OzUTBIHXzxE", "recipe_video_embed_url": "https://www.youtube.com/embed/OzUTBIHXzxE", "recipe_video_creator": "Vành Khuyên Lê", "allergens_by_recipe": "dish: fish", "ingredients": [{"dish_id": "DISH_002", "variant_id": null, "name_vi": "Gà", "name_en_machine": null, "group": "main", "role": "typical", "quantity_raw": "Gà 1.8 kg"}, {"dish_id": "DISH_002", "variant_id": null, "name_vi": "Xương gà", "name_en_machine": null, "group": "broth", "role": "typical", "quantity_raw": "Xương gà 1.6 kg"}, {"dish_id": "DISH_002", "variant_id": null, "name_vi": "Bánh phở", "name_en_machine": null, "group": "main", "role": "typical", "quantity_raw": "Bánh phở 1 kg"}, {"dish_id": "DISH_002", "variant_id": null, "name_vi": "Nước", "name_en_machine": null, "group": "main", "role": "typical", "quantity_raw": "Nước 3.1 lít"}, {"dish_id": "DISH_002", "variant_id": null, "name_vi": "Hành khô", "name_en_machine": null, "group": "seasoning", "role": "typical", "quantity_raw": "Hành khô 50 gr"}, {"dish_id": "DISH_002", "variant_id": null, "name_vi": "Gừng", "name_en_machine": null, "group": "seasoning", "role": "typical", "quantity_raw": "Gừng 50 gr"}, {"dish_id": "DISH_002", "variant_id": null, "name_vi": "Hạt mùi", "name_en_machine": null, "group": "seasoning", "role": "typical", "quantity_raw": "Hạt mùi 10 gr"}, {"dish_id": "DISH_002", "variant_id": null, "name_vi": "Hành tây", "name_en_machine": null, "group": "seasoning", "role": "typical", "quantity_raw": "Hành tây 1 củ"}, {"dish_id": "DISH_002", "variant_id": null, "name_vi": "Gia vị thông dụng", "name ISH_003", "name_vi": "Bún chả", "name_en": "Bun cha", "aliases": null, "category": "grilled", "short_description_vi": "Bún chả là một món ăn của Việt Nam, bao gồm bún, chả thịt lợn nướng trên than hoa và bát nước mắm chua cay mặn ngọt.", "description_vi": "Bún chả là một món ăn của Việt Nam, bao gồm bún, chả thịt lợn nướng trên than hoa và bát nước mắm chua cay mặn ngọt. Món ăn xuất xứ từ miền Bắc Việt Nam, là thứ quà có sức sống lâu bền nhất của Hà Nội, nên có thể coi đây là một trong những đặc sản đặc trưng của ẩm thực Hà thành. Bún chả có nét tương tự món bún thịt nướng ở miền Trung và miền Nam, nhưng nước mắm pha có vị thanh nhẹ hơn. Bún chả thường được ăn kèm với nước chấm chua ngọt, tỏi ớt và các loại rau sống tươi ngon như xà lách, kinh giới.\n\nCựu tổng thống Mỹ Barack Obama đã dùng món ăn này.", "how_to_eat_vi": "Xếp thịt nướng, bún và rau sống ra dĩa. Cho cà rốt, đu đủ ngâm chua và 1 ít ớt băm ra bát sau đó cho nước mắm đường vừa nấu vào rồi khuấy đều là hoàn thành. Chỉ với vài bước đơn giản chúng ta đã món bún chả Hà Nội thơm lừng, hấp dẫn chẳng thua kém ngoài hàng. Khi ăn các bạn gắp 1 ít thịt nướng, bún và rau thơm vào bát nước mắm rồi thưởng thức. Thịt có vị đậm đà, thơm hương của sả và hành, ăn cùng với nước mắm chua ngọt, rau thơm và đồ chua giúp cân bằng vị giác, khiến bạn cứ muốn ăn mãi không ngừng. Nhanh tay vào bếp và làm thử ngay món này nhé!", "ordering_phrase_vi": "Xin bún chả.", "meal_times": [], "taste_profile": "salty | savory | sour | spicy | sweet", "image_url": "https://upload.wikimedia.org/wikipedia/commons/4/4d/B%C3%BAn_ch%E1%BA%A3_Vietnamese_food.jpg", "recipe_video_url": "https://www.youtube.com/watch?v=SQ1j8WkOUZM", "recipe_video_embed_url": "https://www.youtube.com/embed/SQ1j8WkOUZM", "recipe_video_creator": "Diễm Nauy", "allergens_by_recipe": "dish: molluscs,fish", "ingredients": [{"dish_id": "DISH_003", "variant_id": null, "name_vi": "Bún tươi", "name_en_machine": null, "group": "main", "role": "typical", "quantity_raw": "Bún tươ ing": 4.5, "opening_hours": "9:00 – 21:00"}, {"place_id": "PLACE_007", "name": "Tuyết - Bún Chả 34", "address": "34 Hang Than Street", "lat": 21.041303, "lng": 105.847304, "distance_m": 1823.1, "rating": 4.5, "opening_hours": "8h30 – 17h30"}], "serving_places_count": 2, "min_distance_m": 374.2}, {"dish_id": "DISH_004", "name_vi": "Bánh mì", "name_en": "Bánh mì", "aliases": "Bánh mì Việt Nam", "category": "sandwich", "short_description_vi": "Bánh mì là một loại baguette của Việt Nam với lớp vỏ ngoài giòn, ruột mềm, còn bên trong là phần nhân.", "description_vi": "Bánh mì là một loại baguette của Việt Nam với lớp vỏ ngoài giòn, ruột mềm, còn bên trong là phần nhân. Tùy theo văn hóa vùng miền hoặc sở thích cá nhân mà người ta có thể lựa chọn nhiều loại nhân khác nhau, ngoài ra tên gọi của bánh cũng phụ thuộc phần lớn vào những biến tấu ấy.Nhưng những phiên bản phổ biến nhất vẫn thường chứa chả lụa, thịt, hoặc thực phẩm chay, kèm theo một số nguyên liệu phụ khác như pa tê, bơ, rau, ớt, trứng và đồ chua. Bên cạnh đó, bánh còn có thể dùng chung với nhiều món ăn đa dạng, chẳng hạn như cá mòi, xíu mại hoặc thịt bò kho. Bánh mì được xem như một loại thức ăn nhanh bình dân phổ biến và thường được tiêu thụ vào bữa sáng hoặc bất kỳ bữa phụ nào trong ngày. Do có giá thành phù hợp với ví tiền của người dân nên bánh đã trở thành món ăn rất được nhiều người ưa chuộng. Bánh mì Việt Nam đã trở thành một biểu tượng ẩm thực đường phố nổi tiếng thế giới, được nhiều du khách quốc tế yêu thích.\n\nVề lịch sử, bánh mì có nguồn gốc từ bánh baguette do người Pháp đưa vào miền Nam Việt Nam từ thế kỷ 19. Trong những thập kỷ tiếp theo, bánh mì dần lan rộng ra khắp Việt Nam, tuy nhiên phổ biến nhất vẫn là ở Sài Gòn. Người Sài Gòn sau đó đã cải biên chiếc bánh baguette thành ổ bánh mì nhỏ và ngắn hơn, chỉ còn khoảng 20–40 cm, còn ruột bánh thì rỗng hơn để chứa được nhiều nhân, tương tự như món bánh mì kẹp ở phương Tây. Sau năm 1975, theo chân những cuộc di cư vượt biển của người Việt, bánh mì Việt Nam đã trở nên phổ biến ở nhiều quốc gia trên thế giới. Món ăn này gần như có mặt ở mọi đất nước có người Việt hải ngoại sinh sống vì nguyên liệu dễ tìm cũng như cách chế biến đơn giản, phù hợp với nền văn hóa địa phương.\n\nTrong cách gọi thông thường, người Mỹ Anh hóa từ \"bánh mì\" thành banh mi thay vì gọi là Vietnamese sandwich như những món ăn tương tự. Nhiều nhà phê bình lẫn giới mộ điệu, chẳng hạn như tờ The Guardian, đã đưa món bánh vào danh sách những loại bánh mì kẹp xuất sắc nhất toàn cầu. Bên cạnh đó, bánh mì Việt Nam còn là chủ đề chính của một số lễ hội, hội thảo cũng như trong các tác phẩm nghệ thuật. Ngoài ra, đây cũng là một trong những món ăn làm dấy lên tranh cãi về vấn đề an toàn thực phẩm ở Việt Nam cũng như một vài khu vực khác trên thế giới.", "how_to_eat_vi": "Bạn dùng kéo hoặc dao xẻ dọc ổ bánh mì, phết một lớp pate dày vào bên trong. Thêm nộm đồ chua, chà bông, rau thơm và một ít tương ớt. Bạn có thể nướng lại cho bánh mì giòn tan rồi thưởng thức ngay khi còn nóng. Món bánh mì pate thơm ngon, béo ngậy đã sẵn sàng để chiêu đãi cả nhà rồi!", "ordering_phrase_vi": "Xin bánh mì.", "meal_times": "breakfast | snack", "taste_profile": "rich", "image_url": "https://upload.wikimedia.org/wikipedia/commons/0/0c/B%C3%A1nh_m%C3%AC_th%E1%BB%8Bt_n%C6%B0%E1%BB%9Bng.png", "recipe_video_url": "https://www.youtube.com/watch?v=mdCOPELL4Qw", "recipe_video_embed_url": "https://www.youtube.com/embed/mdCOPELL4Qw", "recipe_video_creator": "Handmade VN", "allergens_by_recipe": "dish: milk,gluten_cereals,eggs", "ingredients": [{"dish_id": "DISH_004", "variant_id": null, "name_vi": "Gan heo", "name_en_machine": null, "group": "main", "role": "typical", "quantity_raw": "Gan heo 1 kg"}, {"dish_id": "DISH_004", "variant_id": null, "name_vi": "Thịt nạc lẫn mỡ", "name_en_machine": null, "group": "main", "role": "typical", "quantity_raw": "Thịt nạc lẫn mỡ 500 gr"}, {"dish_id": "DISH_004", "variant_id": null, "name_vi": "Mỡ khổ", "name_en_machine": null, "group": "seasoni ược dùng như bữa ăn nhẹ, ăn chơi, đôi khi là bữa tối chính. Thành phần chính gồm có bún tươi, đậu hũ chiên vàng, chả cốm, thịt luộc, nem chua rán, dồi, mắm tôm pha và ăn kèm với các loại rau thơm như tía tô, kinh giới, rau húng, xà lách, cà pháo... Cũng như các món ăn dân gian khác, nhờ giá thành rẻ nên bún đậu được nhiều người giới bình dân ưa chuộng, vì vậy thu nhập của những người bán món ăn này khá cao.", "how_to_eat_vi": "Bún đậu mắm tôm với màu sắc bắt mắt, kết hợp hài hòa nhiều loại nguyên liệu \"đầy ụ\" tạo cảm giác tròn đầy. Mẹt bún đậu tuy dân dã đơn giản nhưng lại mang đến cho bạn một món ăn vô cùng hấp dẫn, thơm ngon chuẩn vị như ngoài hàng lại giúp cả nhà thêm sự gắn kết khi cùng nhau quây quần thưởng thức một món ăn ngon mang đậm nét ẩm thực Việt Nam.", "ordering_phrase_vi": "Xin bún đậu mắm tôm.", "meal_times": "dinner | snack", "taste_profile": [], "image_url": "https://upload.wikimedia.org/wikipedia/commons/1/11/B%C3%BAn_%C4%91%E1%BA%ADu_m%E1%BA%AFm_t%C3%B4m_%282019%29.jpg", "recipe_video_url": "https://www.youtube.com/watch?v=wiy_GKcrkxk", "recipe_video_embed_url": "https://www.youtube.com/embed/wiy_GKcrkxk", "recipe_video_creator": "HÀ COOKING", "allergens_by_recipe": "dish: soybeans,crustaceans,gluten_cereals", "ingredients": [{"dish_id": "DISH_006", "variant_id": null, "name_vi": "Bún lá", "name_en_machine": null, "group": "main", "role": "typical", "quantity_raw": "Bún lá 1 ít"}, {"dish_id": "DISH_006", "variant_id": null, "name_vi": "Đậu hũ", "name_en_machine": null, "group": "main", "role": "typical", "quantity_raw": "Đậu hũ 1 kg"}, {"dish_id": "DISH_006", "variant_id": null, "name_vi": "Phèo non", "name_en_machine": null, "group": "main", "role": "typical", "quantity_raw": "Phèo non 600 gr"}, {"dish_id": "DISH_006", "variant_id": null, "name_vi": "Gan", "name_en_machine": null, "group": "main", "role": "typical", "quantity_raw": "Gan 200 gr"}, {"dish_id": "DISH_006", "variant_id": null, "name_vi": "Huyết", "name_en_machine": null, "group": ăn nổi tiếng của người Việt, chúng cũng được gọi tắt là nem theo cách gọi phổ biến ở miền Bắc.", "description_vi": "Nem rán (hay chả giò, chả ram hay chả đa nem) là tên một món ăn nổi tiếng của người Việt, chúng cũng được gọi tắt là nem theo cách gọi phổ biến ở miền Bắc. Ở miền Trung, món ăn này thường gọi là ram (riêng ở Thanh Hóa gọi là chả), còn ở miền Nam, nó được gọi là chả giò.\n\nNem truyền thống thường có nguyên liệu chính là thịt lợn, miến, trứng gà, nấm mèo,... và một số gia vị thông dụng của ẩm thực Việt như hành lá, tiêu, nước mắm, được cuốn bằng bánh tráng và chiên ngập dầu. Nem thường được ăn kèm với nước mắm pha, đồ chua và rau xà lách, các loại rau thơm như húng quế, húng cây, diếp cá,...\n\nỞ miền Bắc cũng có loại nem rán được gói thành hình vuông thay vì hình trụ (như món nem vuông - nem cua bể Hải Phòng). Nem rán cũng thường được dọn kèm bún chả Hà Nội. Ở miền Nam đôi khi chả giò được ăn kèm các loại rau lá có sẵn và dễ tìm ở vườn như đọt cóc, rau sao nhái, rau quế vị, rau xương máu (hoặc săng máu),... Các loại rau này thường được gọi là rau rừng. Nem cũng có thể ăn kèm bún tạo thành món bún nem.\n\nNgoài món nem rán truyền thống còn có một số loại nem rán khác như món nem rán hải sản, nem rán chay,...", "how_to_eat_vi": "Nem rán thường được ăn kèm cơm nóng hoặc bún. Bạn cũng có thể chuẩn bị ít rau sống như rau xà lách, húng lủi, húng quế để ăn cùng. Nem rán có màu vàng ươm bắt mắt, nóng hổi. Khi ăn, bạn sẽ cảm nhận được độ giòn rụm của lớp vỏ, phần nhân mềm, ẩm, đậm đà gia vị, ăn cùng nước chấm sẽ là sự kết hợp tuyệt vời. Đã ăn thử một lần là chỉ muốn ăn mãi mà thôi!", "ordering_phrase_vi": "Xin nem rán.", "meal_times": [], "taste_profile": "savory", "image_url": "https://upload.wikimedia.org/wikipedia/commons/6/6b/Cha_gio.jpg", "recipe_video_url": "https://www.youtube.com/watch?v=VN7GnUm5rfo", "recipe_video_embed_url": "https://www.youtube.com/embed/VN7GnUm5rfo", "recipe_video_creator": "Bếp Của Giang", "allergens_by_recipe": "dish: eggs,fish",       el.style.height = "0px";
      el.style.position = "absolute";
      el.innerHTML = `
        <div class="marker-wrap">
          <div class="pulse-ring"></div>
          <svg width="200" height="54" viewBox="-16 -46 200 54" style="position: absolute; left: -16px; top: -46px; width: 200px; height: 54px; overflow: visible;">
            <defs>
              <filter id="vm-shadow" x="-20%" y="-20%" width="140%" height="150%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#2B0E0E" floodOpacity="0.3"/>
              </filter>
            </defs>
            <rect filter="url(#vm-shadow)" x="8" y="-42" width="170" height="32" rx="8" fill="#FFF5F2" stroke="#DC2626" stroke-width="1.8"/>
            <path d="M -4 -16 L 0 0 L 4 -16 Z" fill="#991B1B"/>
            <circle cx="0" cy="-26" r="14" fill="#991B1B" stroke="#FFFFFF" stroke-width="1.5"/>
            <circle cx="0" cy="0" r="3" fill="#DC2626" stroke="#FFFFFF" stroke-width="1"/>
            <text x="0" y="-21" text-anchor="middle" font-size="12" fill="#FFFFFF">🏛️</text>
            <text x="24" y="-27" font-size="12" font-weight="700" fill="#991B1B" font-family="'Be Vietnam Pro', sans-serif">Văn Miếu – Quốc Tử Giám</text>
            <text x="24" y="-15" font-size="10" font-weight="600" fill="#B45309" font-family="'Be Vietnam Pro', sans-serif">★ Tâm điểm khảo sát (0m)</text>
          </svg>
        </div>
      `;
      el.onclick = () => {
        map.flyTo({ center: VAN_MIEU, zoom: 15.5, duration: 800 });
        openVanMieuDetail();
      };
      new maplibregl.Marker({ element: el, anchor: "top-left" })
        .setLngLat(VAN_MIEU)
        .addTo(map);
    }

    function createMarkerHtml(place, isSelected) {
      const catMeta = DATA.category_meta[place.primary_category] || {};
      const icon = catMeta.icon || "🍜";

      // Full Expanded Callout pointing directly to (0, 0)
      const name = place.name.length > 20 ? place.name.slice(0, 19) + "…" : place.name;
      const dist = place.distance_m ? `${place.distance_m}m` : "";
      const rating = Math.min(5, Math.max(1, Math.round(place.rating || 5)));
      const stars = "★".repeat(rating);
      const width = Math.max(128, name.length * 6.8 + 48);

      const pinColor = isSelected ? "#991B1B" : "#7A1E1E";
      const strokeColor = isSelected ? "#DC2626" : "#EAD9D4";
      const strokeWidth = isSelected ? "1.8" : "1";
      const bg = isSelected ? "#FFF5F2" : "#FFFFFF";

      return `
        <div class="marker-wrap${isSelected ? ' active' : ''}">
          <svg width="${width + 30}" height="50" viewBox="-16 -44 ${width + 30} 50" style="position: absolute; left: -16px; top: -44px; width: ${width + 30}px; height: 50px; overflow: visible;">
            <defs>
              <filter id="sh-${place.place_id}" x="-20%" y="-20%" width="140%" height="150%">
                <feDropShadow dx="0" dy="2" stdDeviation="2.5" floodColor="#2B0E0E" floodOpacity="0.2"/>
              </filter>
            </defs>
            <rect filter="url(#sh-${place.place_id})" x="6" y="-38" width="${width}" height="30" rx="7" fill="${bg}" stroke="${strokeColor}" stroke-width="${strokeWidth}"/>
            <path d="M -3.5 -14 L 0 0 L 3.5 -14 Z" fill="${pinColor}"/>
            <circle cx="0" cy="-23" r="12" fill="${pinColor}" stroke="#FFFFFF" stroke-width="1.2"/>
            <circle cx="0" cy="0" r="2.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="0.8"/>
            <text x="0" y="-19" text-anchor="middle" font-size="11" fill="#FFFFFF">${icon}</text>
            <text x="19" y="-25" font-size="11" font-weight="700" fill="${isSelected ? '#991B1B' : '#1F2937'}" font-family="'Be Vietnam Pro', sans-serif">${name}</text>
            <text x="19" y="-14" font-size="10" font-weight="700" fill="#D97706" font-family="'Be Vietnam Pro', sans-serif">${stars}</text>
            <text x="${19 + rating * 7 + 4}" y="-14" font-size="9" font-weight="600" fill="#6B7280" font-family="'Be Vietnam Pro', sans-serif">${dist}</text>
          </svg>
        </div>
      `;
    }

    function updateMapMarkers() {
      markers.forEach(m => m.remove());
      markers = [];

      const currentZoom = map.getZoom();
      const showVenues = currentZoom >= VENUE_MIN_ZOOM;
      const filtered = getFilteredPlaces();

      if (showVenues || selectedPlaceId) {
        filtered.forEach(place => {
          const isSelected = selectedPlaceId === place.place_id;
          if (!showVenues && !isSelected) return;

          const el = document.createElement("div");
          el.style.width = "0px";
          el.style.height = "0px";
          el.style.position = "absolute";
          el.innerHTML = createMarkerHtml(place, isSelected);
          el.onclick = (e) => {
            e.stopPropagation();
            selectPlace(place);
          };

          const marker = new maplibregl.Marker({ element: el, anchor: "top-left" })
            .setLngLat([place.lng, place.lat])
            .addTo(map);

          markers.push(marker);
        });
      }

      const bannerBadge = document.getElementById("banner-count");
      if (showVenues) {
        bannerBadge.innerText = `Bán kính 2.0km • ${filtered.length} quán ăn đang hiển thị`;
      } else {
        bannerBadge.innerText = `Bán kính 2.0km • Phóng to gần để xem ${filtered.length} quán ăn 🔍`;
      }
    }

    function getFilteredPlaces() {
      const q = searchQuery.toLowerCase().trim();
      return DATA.places.filter(p => {
        if (q) {
          const matchName = p.name.toLowerCase().includes(q);
          const matchAddr = p.address.toLowerCase().includes(q);
          const matchDish = (p.dishes || []).some(d => d.dish_name_vi.toLowerCase().includes(q));
          if (!matchName && !matchAddr && !matchDish) return false;
        }
        if (activeCategory !== "all") {
          const hasCat = p.primary_category === activeCategory || (p.dishes || []).some(d => d.category === activeCategory);
          if (!hasCat) return false;
        }
        if (distanceFilter !== "all") {
          if (p.distance_m > parseFloat(distanceFilter)) return false;
        }
        return true;
      }).sort((a, b) => {
        if (sortBy === "distance") return a.distance_m - b.distance_m;
        if (sortBy === "rating") return b.rating - a.rating;
        return a.name.localeCompare(b.name, "vi");
      });
    }

    function getFilteredDishes() {
      const q = searchQuery.toLowerCase().trim();
      return DATA.dishes.filter(d => {
        if (q) {
          const matchName = d.name_vi.toLowerCase().includes(q);
          const matchEn = d.name_en && d.name_en.toLowerCase().includes(q);
          const matchDesc = d.description_vi && d.description_vi.toLowerCase().includes(q);
          if (!matchName && !matchEn && !matchDesc) return false;
        }
        if (activeCategory !== "all") {
          if (d.category !== activeCategory) return false;
        }
        if (distanceFilter !== "all") {
          if (d.min_distance_m > parseFloat(distanceFilter)) return false;
        }
        return true;
      }).sort((a, b) => {
        if (sortBy === "distance") return a.min_distance_m - b.min_distance_m;
        return a.name_vi.localeCompare(b.name_vi, "vi");
      });
    }

    function renderThemePills() {
      const container = document.getElementById("theme-pills");
      container.innerHTML = "";

      const allBtn = document.createElement("button");
      allBtn.className = "theme-chip" + (activeCategory === "all" ? " active" : "");
      allBtn.innerHTML = `<span>✨</span><span>Tất cả</span>`;
      allBtn.onclick = () => { activeCategory = "all"; updateUI(); };
      container.appendChild(allBtn);

      Object.entries(DATA.category_meta).forEach(([k, meta]) => {
        const btn = document.createElement("button");
        btn.className = "theme-chip" + (activeCategory === k ? " active" : "");
        btn.innerHTML = `<span>${meta.icon}</span><span>${meta.label}</span>`;
        btn.onclick = () => { activeCategory = k; updateUI(); };
        container.appendChild(btn);
      });
    }

    function renderList() {
      const container = document.getElementById("list-items");
      container.innerHTML = "";

      if (currentViewMode === "places") {
        const list = getFilteredPlaces();
        document.getElementById("results-count-text").innerText = `Tìm thấy ${list.length} quán ăn`;
        list.forEach(p => {
          const catMeta = DATA.category_meta[p.primary_category] || {};
          const topDish = p.dishes?.[0]?.dish_name_vi || "Món đặc sản";
          const isSel = selectedPlaceId === p.place_id;

          const card = document.createElement("div");
          card.className = "card-item" + (isSel ? " selected" : "");
          card.innerHTML = `
            <div class="card-thumb-wrap">
              <img src="${p.image_url}" class="card-thumb" onerror="this.src='https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=300'">
              <span class="card-cat-badge">${catMeta.icon || '🍜'} ${catMeta.label || 'Món ngon'}</span>
            </div>
            <div class="card-info">
              <h3 class="card-name">${p.name}</h3>
              <p class="card-addr">${p.address}</p>
              <div class="card-badges">
                <span class="badge-dist">🧭 ${p.distance_m}m từ Văn Miếu</span>
                <span class="badge-rate">★ ${p.rating}</span>
              </div>
              <div class="card-foot">
                <span class="card-dish-tag">Món: ${topDish}</span>
                <span class="card-price-tag">${p.price_min_vnd ? (p.price_min_vnd/1000)+'k' : ''} - ${p.price_max_vnd ? (p.price_max_vnd/1000)+'k' : ''}</span>
              </div>
            </div>
          `;
          card.onclick = () => selectPlace(p);
          container.appendChild(card);
        });
      } else {
        const list = getFilteredDishes();
        document.getElementById("results-count-text").innerText = `Tìm thấy ${list.length} món ăn`;
        list.forEach(d => {
          const catMeta = DATA.category_meta[d.category] || {};
          const card = document.createElement("div");
          card.className = "card-item";
          card.innerHTML = `
            <div class="card-thumb-wrap">
              <img src="${d.image_url}" class="card-thumb" onerror="this.src='https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=300'">
              <span class="card-cat-badge">${catMeta.icon || '🍲'} ${catMeta.label || 'Đặc sản'}</span>
            </div>
            <div class="card-info">
              <h3 class="card-name">${d.name_vi}</h3>
              <p class="card-addr">${d.short_description_vi || d.description_vi?.slice(0, 80) + '...'}</p>
              <div class="card-badges">
                <span class="badge-dist">📍 ${d.serving_places_count} quán gần Văn Miếu</span>
                <span class="badge-rate">Gần nhất: ${d.min_distance_m}m</span>
              </div>
            </div>
          `;
          card.onclick = () => openDishDetail(d);
          container.appendChild(card);
        });
      }
    }

    function selectPlace(place) {
      selectedPlaceId = place.place_id;
      map.flyTo({
        center: [place.lng, place.lat],
        zoom: 16,
        padding: { right: 380 },
        duration: 900
      });
      updateMapMarkers();
      renderList();
      openPlaceDetail(place);
    }

    function openPlaceDetail(place) {
      const catMeta = DATA.category_meta[place.primary_category] || {};
      const dishes = place.dishes || [];
      const overlay = document.getElementById("detail-overlay");
      const sheet = document.getElementById("detail-sheet");

      sheet.innerHTML = `
        <div class="detail-img-wrap">
          <img src="${place.image_url}" class="detail-img" onerror="this.src='https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=800'">
          <button class="detail-close" onclick="closeDetail()">✕</button>
          <div class="detail-img-overlay">
            <span style="background: rgba(220, 38, 38, 0.9); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; align-self: flex-start;">${catMeta.icon || '📍'} ${catMeta.label || 'Quán ăn'}</span>
            <h2 class="detail-title">${place.name}</h2>
            <p class="detail-sub">${place.branch_name || ''} • ★ ${place.rating} • Cách Văn Miếu ${place.distance_m}m</p>
          </div>
        </div>
        <div class="detail-tabs">
          <button class="detail-tab active">Tổng quan & Thực đơn</button>
        </div>
        <div class="detail-body">
          <div class="detail-box">
            <div><strong>📍 Địa chỉ:</strong> ${place.address}</div>
            <div><strong>🕒 Giờ mở cửa:</strong> ${place.opening_hours || '07:00 - 21:00'}</div>
            <div><strong>💰 Khoảng giá:</strong> ${place.price_min_vnd ? place.price_min_vnd.toLocaleString() + 'đ' : ''} - ${place.price_max_vnd ? place.price_max_vnd.toLocaleString() + 'đ' : ''}</div>
            <div><strong>🧭 Khoảng cách:</strong> ${place.distance_m}m từ Văn Miếu Quốc Tử Giám</div>
          </div>
          <a href="https://www.google.com/maps/dir/?api=1&origin=21.02879,105.835953&destination=${place.lat},${place.lng}" target="_blank" class="btn-maps">🧭 Chỉ đường từ Văn Miếu</a>
          <h3 style="font-size: 15px; font-weight: 700; color: #1F2937; margin-top: 8px;">Món ăn phục vụ (${dishes.length})</h3>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            ${dishes.map(d => `
              <div style="background: #fbf7f4; border: 1px solid #ebdcd6; border-radius: 8px; padding: 10px; display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <strong style="font-size: 13.5px; color: #1F2937;">${d.dish_name_vi}</strong>
                  ${d.variant ? `<div style="font-size: 11.5px; color: #78716c;">Biến thể: ${d.variant}</div>` : ''}
                </div>
                <span style="font-weight: 700; color: #b91c1c; font-size: 13px;">${d.price_min_vnd ? d.price_min_vnd.toLocaleString() + 'đ' : 'Theo giá quán'}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      overlay.style.display = "flex";
    }

    function openDishDetail(dish) {
      const catMeta = DATA.category_meta[dish.category] || {};
      const overlay = document.getElementById("detail-overlay");
      const sheet = document.getElementById("detail-sheet");

      sheet.innerHTML = `
        <div class="detail-img-wrap">
          <img src="${dish.image_url}" class="detail-img" onerror="this.src='https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?w=800'">
          <button class="detail-close" onclick="closeDetail()">✕</button>
          <div class="detail-img-overlay">
            <span style="background: rgba(220, 38, 38, 0.9); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; align-self: flex-start;">${catMeta.icon || '🍲'} ${catMeta.label || 'Món ăn'}</span>
            <h2 class="detail-title">${dish.name_vi}</h2>
            <p class="detail-sub">${dish.name_en || ''}</p>
          </div>
        </div>
        <div class="detail-tabs">
          <button class="detail-tab active">Thông tin & Công thức</button>
        </div>
        <div class="detail-body">
          <p style="font-size: 13.5px; line-height: 1.6; color: #44403c;">${dish.description_vi || dish.short_description_vi || ''}</p>
          ${dish.how_to_eat_vi ? `
            <div style="background: #f0fdf4; border-left: 4px solid #16a34a; padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 13px; color: #15803d;">
              <strong>Cách thưởng thức chuẩn vị Hà Nội:</strong><br>${dish.how_to_eat_vi}
            </div>
          ` : ''}
          ${dish.ordering_phrase_vi ? `
            <div style="background: #eff6ff; border-left: 4px solid #3b82f6; padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 13px; color: #1d4ed8;">
              <strong>Cách gọi món sành điệu:</strong> "${dish.ordering_phrase_vi}"
            </div>
          ` : ''}
          <h3 style="font-size: 15px; font-weight: 700; color: #1F2937; margin-top: 6px;">Quán phục vụ gần Văn Miếu (${dish.serving_places_count})</h3>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            ${(dish.serving_places || []).map(p => `
              <div style="background: #fdfaf8; border: 1px solid #ebdcd6; border-radius: 8px; padding: 10px; cursor: pointer;" onclick="flyToServingPlace('${p.place_id}')">
                <div style="display: flex; justify-content: space-between;">
                  <strong style="color: #1F2937; font-size: 13.5px;">${p.name}</strong>
                  <span style="color: #991b1b; font-weight: 700; font-size: 12px;">🧭 ${p.distance_m}m</span>
                </div>
                <div style="font-size: 12px; color: #78716c; margin-top: 2px;">${p.address}</div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      overlay.style.display = "flex";
    }

    function openVanMieuDetail() {
      const overlay = document.getElementById("detail-overlay");
      const sheet = document.getElementById("detail-sheet");
      sheet.innerHTML = `
        <div class="detail-img-wrap">
          <img src="https://images.unsplash.com/photo-1599707367072-cd6ada2bc375?w=800" class="detail-img">
          <button class="detail-close" onclick="closeDetail()">✕</button>
          <div class="detail-img-overlay">
            <span style="background: #991B1B; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; align-self: flex-start;">🏛️ Di Tích Quốc Gia Đặc Biệt</span>
            <h2 class="detail-title">Văn Miếu – Quốc Tử Giám</h2>
            <p class="detail-sub">Tâm điểm khảo sát ẩm thực Hà Nội</p>
          </div>
        </div>
        <div class="detail-body">
          <div class="detail-box">
            <div><strong>Tọa độ tâm điểm:</strong> 21.02879° N, 105.835953° E</div>
            <div><strong>Địa chỉ:</strong> 58 Quốc Tử Giám, Đống Đa, Hà Nội</div>
            <div><strong>Phạm vi khảo sát:</strong> Bán kính 2.0 km (70 quán ăn, 50 món ăn)</div>
          </div>
          <p style="font-size: 13.5px; line-height: 1.6; color: #44403c;">
            Văn Miếu – Quốc Tử Giám là trường đại học đầu tiên của Việt Nam, được chọn làm tọa độ gốc (0m) để đo khoảng cách và bán kính khảo sát văn hóa ẩm thực Thăng Long - Hà Nội.
          </p>
          <a href="https://www.google.com/maps/search/?api=1&query=Văn+Miếu+Quốc+Tử+Giám" target="_blank" class="btn-maps">🗺️ Mở trên Google Maps</a>
        </div>
      `;
      overlay.style.display = "flex";
    }

    function closeDetail() {
      document.getElementById("detail-overlay").style.display = "none";
    }

    function flyToServingPlace(pid) {
      const p = DATA.places.find(x => x.place_id === pid);
      if (p) selectPlace(p);
    }

    function updateUI() {
      renderThemePills();
      renderList();
      updateMapMarkers();
    }

    // Events
    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      updateUI();
    });
    document.getElementById("btn-view-places").addEventListener("click", () => {
      currentViewMode = "places";
      document.getElementById("btn-view-places").classList.add("active");
      document.getElementById("btn-view-dishes").classList.remove("active");
      updateUI();
    });
    document.getElementById("btn-view-dishes").addEventListener("click", () => {
      currentViewMode = "dishes";
      document.getElementById("btn-view-dishes").classList.add("active");
      document.getElementById("btn-view-places").classList.remove("active");
      updateUI();
    });
    document.getElementById("select-dist").addEventListener("change", (e) => {
      distanceFilter = e.target.value;
      updateUI();
    });
    document.getElementById("select-sort").addEventListener("change", (e) => {
      sortBy = e.target.value;
      updateUI();
    });
    document.getElementById("btn-recenter").addEventListener("click", () => {
      map.flyTo({ center: VAN_MIEU, zoom: 14.8, duration: 800 });
    });
    document.getElementById("btn-recenter-card").addEventListener("click", () => {
      map.flyTo({ center: VAN_MIEU, zoom: 15.5, duration: 800 });
      openVanMieuDetail();
    });
    document.getElementById("banner-count").addEventListener("click", () => {
      if (map.getZoom() < VENUE_MIN_ZOOM) {
        map.flyTo({ center: VAN_MIEU, zoom: 15.0, duration: 800 });
      }
    });
    document.getElementById("btn-fit-hanoi").addEventListener("click", () => {
      map.fitBounds([[105.2889615, 20.5645154], [106.0200407, 21.3854176]], { padding: 40, duration: 900 });
    });
    document.getElementById("btn-zoom-in").addEventListener("click", () => map.zoomIn());
    document.getElementById("btn-zoom-out").addEventListener("click", () => map.zoomOut());

    document.getElementById("btn-toggle-circle").addEventListener("click", (e) => {
      showCircle = !showCircle;
      e.currentTarget.classList.toggle("active", showCircle);
      const vis = showCircle ? "visible" : "none";
      if (map.getLayer("circle-fill")) map.setLayoutProperty("circle-fill", "visibility", vis);
      if (map.getLayer("circle-line")) map.setLayoutProperty("circle-line", "visibility", vis);
    });

    document.getElementById("btn-toggle-hanoi").addEventListener("click", (e) => {
      showHanoi = !showHanoi;
      e.currentTarget.classList.toggle("active", showHanoi);
      const vis = showHanoi ? "visible" : "none";
      if (map.getLayer("hanoi-fill")) map.setLayoutProperty("hanoi-fill", "visibility", vis);
      if (map.getLayer("hanoi-line")) map.setLayoutProperty("hanoi-line", "visibility", vis);
    });

    document.getElementById("detail-overlay").addEventListener("click", (e) => {
      if (e.target.id === "detail-overlay") closeDetail();
    });

    // Initialize UI
    renderThemePills();
    renderList();
  </script>
</body>
</html>
